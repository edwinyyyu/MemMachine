name: Run Python test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel any preceding run on the pull request after a new commit is pushed.
concurrency:
  group: pytest-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}

  # Don't cancel if running on a push to the main branch.
  cancel-in-progress: ${{ (github.event.pull_request.head.ref || github.ref) != 'refs/heads/main' }}

jobs:
  unit-test:
    name: Run Python unit tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Fetch full Git history for SCM versioning

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Test with python ${{ matrix.python-version }}
        run: |
          # Run core tests (require Python 3.12+)
          uv run --frozen --all-extras pytest packages/core/tests --cov=memmachine_core
