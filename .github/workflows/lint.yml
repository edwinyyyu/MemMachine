name: Lint Python code

permissions:
  contents: read

# Cancel any preceding run on the pull request after a new commit is pushed.
concurrency:
  group: ruff-lint-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}

  # Don't cancel if running on a push to the main branch.
  cancel-in-progress: ${{ (github.event.pull_request.head.ref || github.ref) != 'refs/heads/main' }}

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Lint check
      - uses: astral-sh/ruff-action@v4.1.0
        name: ruff check
        with:
          version-file: "pyproject.toml"

      # Format check
      - uses: astral-sh/ruff-action@v4.1.0
        name: ruff format check
        with:
          version-file: "pyproject.toml"
          args: "format --check --diff"

  ty-static-check-core:
    name: ty static check core package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test on the oldest and newest supported Python versions
        python-version: [ "3.12", "3.14" ]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Type check core package (Python ${{ matrix.python-version }})
        env:
          # Interpolate into the environment, never into the shell command.
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv run --frozen --all-extras ty check \
            --project packages/core --python-version "$PYTHON_VERSION"
