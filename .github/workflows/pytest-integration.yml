name: Run Python integration tests
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# Cancel any preceding run on the pull request after a new commit is pushed.
concurrency:
  group: integration-test-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}

  # Don't cancel if running on a push to the main branch.
  cancel-in-progress: ${{ (github.event.pull_request.head.ref || github.ref) != 'refs/heads/main' }}

jobs:
  integration-test:
    strategy:
      fail-fast: false
      matrix:
        # Each integration test path is a separate job to allow for parallel execution
        test-paths: [
          # Core common provider/storage tests
          "packages/core/tests/memmachine_core/common/",
        ]
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
        # Test on the oldest and newest supported Python versions
        python-version: [ "3.12", "3.14" ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Fetch full Git history for SCM versioning

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Test ${{ matrix.test-paths }} with python ${{ matrix.python-version }}
        env:
          # Interpolate into the environment, never into the shell command.
          TEST_PATHS: ${{ matrix.test-paths }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          # Run the slow integration tests only on main; keep pull request
          # feedback fast by skipping them there.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            markers="integration"
          else
            markers="integration and not slow"
          fi
          uv run --frozen --all-extras pytest "$TEST_PATHS" \
            -m "$markers" --cov=memmachine_core
