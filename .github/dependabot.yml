# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv"
    # The uv.lock lives at the repo root and locks every workspace member.
    # Listing each workspace pyproject.toml lets Dependabot edit the right
    # [project.dependencies] block in addition to bumping uv.lock.
    directories:
      - "/"
      - "/packages/core"
    schedule:
      interval: "weekly"
    groups:
      uv-workspace:
        patterns:
          - "*"

  # Keeps the pinned `uses:` refs in .github/workflows current. Without this,
  # exact version pins never get bumped and silently fall behind.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
