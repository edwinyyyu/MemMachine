[project]
name = "rbench"
version = "0.1.0"
description = "When does a reranker help retrieval? Span-coverage benchmark for Qwen3 rerankers over embedding retrieval."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.0",
    "tokenizers>=0.21",
    "torch>=2.10",
    "transformers>=5.0",
    "pyarrow>=20",
    "huggingface-hub>=0.30",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "ijson>=3.6.0",
    "babel>=2.18.0",
    "langchain-text-splitters>=1.1.3",
    "memmachine-server",
    "memmachine-common",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]  # zip() without strict=: lengths are checked where it matters

[tool.uv.sources]
memmachine-server = { git = "https://github.com/MemMachine/MemMachine", subdirectory = "packages/server", rev = "043fb75380b07f787d7571b910cded6ce181fd74" }
memmachine-common = { git = "https://github.com/MemMachine/MemMachine", subdirectory = "packages/common", rev = "043fb75380b07f787d7571b910cded6ce181fd74" }
