[tool.uv.workspace]
members = ["packages/core"]

[tool.uv.sources]
memmachine-core = { workspace = true }

[tool.uv]
constraint-dependencies = [
    "python-dotenv>=1.2.2",
    "langsmith>=0.7.31",
    "langchain-core>=1.2.28",
    "Pygments>=2.20.0",
    "transformers>=5.0.0",
]

[dependency-groups]
dev = [
    "boto3>=1.40.40",
    "complexipy>=5.4.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "ruff==0.15.14",
    "testcontainers[postgres,qdrant]>=4.14.2",
    "ty~=0.0.38",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
exclude = [
    "build",
    ".tmp",
]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E",
    "F",
    "FA",
    "FAST",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PERF",
    "PIE",
    "PLC",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "SLF",
    "SIM",
    "T20",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
# D213 (summaries open on the second line) is enforced over its
# mutually exclusive google-convention counterpart D212.
extend-select = ["D213"]
ignore = [
    "E501",    # line length is the formatter's job; what remains is unsplittable
    "PLC0415", # function-level imports defer heavy or optional dependencies
    "D212",    # mutually exclusive with the enforced D213
    "TRY003",  # plain exceptions with inline messages
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Do not add any new paths under packages/
[tool.ruff.lint.per-file-ignores]
# INP: tests/ trees are deliberately namespace packages (see pytest config).
"packages/*/tests/**/*.py" = ["ANN", "D", "SLF", "ARG", "INP"]

[tool.ty.environment]
extra-paths = [
    "packages/core",
]

[tool.ty.src]
exclude = ["packages/**/build/**"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# importlib import mode loads test modules by path instead of by mutating
# sys.path, so test directories need no __init__.py and basenames need not be
# globally unique (e.g. two test_data_types.py under different subpackages).
addopts = ["-m", "not integration", "--import-mode=importlib"]
# Every package's tests/ is a PEP 420 namespace package with NO __init__.py, so
# the tests/ trees of separate workspace members merge instead of shadowing:
# packages/core/tests/memmachine_core -> tests.memmachine_core
# packages/server/tests/memmachine_server -> tests.memmachine_server
# Each member's tests/ must therefore mirror its own distribution package name.
# Adding a member means adding its directory here.
pythonpath = ["packages/core"]
consider_namespace_packages = true

markers = [
    "integration: mark the test as an integration test",
    "slow: mark the test as slow"
]

[tool.complexipy]
paths = ["packages/core/src"]
max-complexity-allowed = 10
quiet = false
ignore-complexity = false
details = "low"
color = "auto"
sort = "desc"
exclude = []

[tool.coverage.run]
source = [
    "packages/core/src/memmachine_core",
]

[tool.coverage.report]
sort = "cover"
