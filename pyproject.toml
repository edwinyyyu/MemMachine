[tool.uv.workspace]
members = ["packages/core"]

[tool.uv.sources]
memmachine-core = { workspace = true }

[tool.uv]
constraint-dependencies = [
    "python-dotenv>=1.2.2",
    "authlib>=1.6.11",
    "Mako>=1.3.11",
    "langsmith>=0.7.31",
    "python-multipart>=0.0.26",
    "langchain-core>=1.2.28",
    "cryptography>=46.0.7",
    "aiohttp>=3.13.4",
    "Pygments>=2.20.0",
    "PyJWT>=2.12.0",
    "transformers>=5.0.0",
]

[dependency-groups]
dev = [
    "complexipy>=5.4.1",
    "complexipy>=5.4.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "ruff==0.15.14",
    "testcontainers[postgres,qdrant]>=4.14.2",
    "ty~=0.0.38",
    "tomli>=2.4.1",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
exclude = [
    "tools",
    "build",
    ".tmp",
    "evaluation/retrieval_skill",
    "src/memmachine-ts",
]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E",
    "F",
    "FA",
    "FAST",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PERF",
    "PIE",
    "PLC",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "SLF",
    "SIM",
    "T20",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "E501", "UP015", "TRY002", "PLC0415",
    "D102", "D212", "D203", "RET504",
    "TRY003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Do not add any new paths under packages/
[tool.ruff.lint.per-file-ignores]
"packages/core/core_tests/**/*.py" = ["ANN", "D", "SLF", "ARG"]
"tools/**/*.py" = ["SIM", "DTZ", "C9", "ANN", "T201", "PT", "INP", "PTH", "D"]
"examples/**" = [
    "ANN",
    "ARG",
    "ASYNC210",
    "C901",
    "D",
    "FA",
    "PERF203",
    "PTH",
    "T201",
    "TRY300",
    "TRY401",
]
"integrations/**" = [
    "ANN",
    "T201",
    "D",
    "ARG",
    "FA",
    "PERF203",
]
"evaluation/**/*.py" = [
    "D",
    "ARG",
    "T201",
    "ANN",
    "FA",
    "PTH123",
    "PTH120",
    "PTH110",
    "PTH100",
    "ASYNC230",
    "RUF001",
    "N806",
    "B023",
    "B007",
    "TRY300",
    "PERF203",
    "PERF401",
]

[tool.ty.environment]
extra-paths = [
    "packages/core",
]

[tool.ty.src]
exclude = ["packages/**/build/**"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["-m", "not integration"]
# Keep both test packages importable regardless of which subset pytest runs,
# so shared test infrastructure resolves by qualified path.
pythonpath = ["packages/core"]

markers = [
    "integration: mark the test as an integration test",
    "slow: mark the test as slow"
]

[tool.complexipy]
paths = ["packages/core/src"]
max-complexity-allowed = 10
quiet = false
ignore-complexity = false
details = "low"
color = "auto"
sort = "desc"
exclude = []

[tool.coverage.run]
source = [
    "packages/core/src/memmachine_core",
]

[tool.coverage.report]
sort = "cover"
